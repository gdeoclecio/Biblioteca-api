spring.application.name=biblioteca-api

# Idioma / fuso
spring.web.locale=pt_br
spring.jackson.time-zone=America/Sao_Paulo

# Porta
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

# =============================================
# SWAGGER
# URL: http://localhost:8080/swagger-ui/index.html
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
# REMOVIDO springdoc.use-fqn=true  ← essa propriedade não existe e causava erro
# REMOVIDO springdoc.model-and-view-allowed=false ← desnecessário e problemático

# =============================================
# EMAIL (Gmail com App Password)
# Troque pelo seu email e senha de app do Gmail
# Para gerar senha de app: myaccount.google.com → Segurança → Senhas de app
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gabizada567@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

