spring.application.name=biblioteca-api
# Define o idioma padrão como português do Brasil
spring.web.locale=pt_br
# Garante que o JSON use o fuso horário correto
spring.jackson.time-zone=America/Sao_Paulo
# Se o cliente mandar um campo que não existe no Model, retorna erro
spring.jackson.deserialization.fail-on-unknown-properties=true
#porta onde a aplicação vai rodar 
server.port=8080
# Conexão com o PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mostra o SQL gerado no terminal
spring.jpa.show-sql=true

# update → cria a tabela se não existir, atualiza se mudar o Model
# create → apaga e recria toda vez (perde os dados!)
# none   → não faz nada
spring.jpa.hibernate.ddl-auto=none



# URL DA INTERFACE SWAGGER UI:  http://localhost:8080/swagger-ui/index.html

#Caminho da documentação OpenApi em json
springdoc.api-docs.path=/api-docs

# Ordena os endpoints por método HTTP
springdoc.swagger-ui.operations-sorter=method