
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>

<body style="font-family: Arial, sans-serif; background-color: #eef4ff; padding: 30px;">

<div style="
    max-width: 600px;
    margin: auto;
    background-color: white;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #0d6efd;
">

    <div style="
        background-color: #0d6efd;
        color: white;
        padding: 20px;
        text-align: center;
    ">
        <h1 style="margin: 0;">✏️ Livro Atualizado</h1>
    </div>

    <div style="padding: 30px; color: #333;">

        <p>
            Os dados do livro abaixo foram atualizados:
        </p>

        <div style="
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        ">

            <h2 style="margin-top: 0;">
                <span th:text="${titulo}"></span>
            </h2>

            <p><strong>Autor:</strong>
                <span th:text="${autor}"></span>
            </p>

            <p><strong>Gênero:</strong>
                <span th:text="${genero}"></span>
            </p>

            <p><strong>Editora:</strong>
                <span th:text="${editora}"></span>
            </p>

            <p><strong>ISBN:</strong>
                <span th:text="${isbn}"></span>
            </p>

            <p><strong>Ano:</strong>
                <span th:text="${ano}"></span>
            </p>

        </div>

    </div>

</div>

</body>
</html>
